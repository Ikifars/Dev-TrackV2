<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>DevTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="card">
  <h2 id="form-title">DevTrack - Login</h2>
  
  <input id="name" placeholder="Nome" style="display: none;">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Senha">
  
  <button id="submit-btn" onclick="handleSubmit()">Entrar</button>
  
  <p id="toggle-text" style="cursor: pointer; margin-top: 15px; font-size: 14px;">
    Não tem conta? <span style="color: #007bff;">Cadastre-se</span>
  </p>
</div>
<script src="js/app.js"></script>
</body>
</html>
