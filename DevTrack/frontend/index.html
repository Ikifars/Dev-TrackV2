<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>DevTrack</title>
<link rel="stylesheet" href="css/style.css">
<style>
  #toggle-text { 
    cursor: pointer; 
    margin-top: 15px; 
    font-size: 14px;
    user-select: none;
  }
  #toggle-text span { 
    color: #007bff; 
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="card">
  <h2 id="form-title">DevTrack - Login</h2>
  
  <input id="name" placeholder="Nome" style="display: none;">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Senha">
  
  <button id="submit-btn" type="button">Entrar</button>
  
  <p id="toggle-text">
    Não tem conta? <span>Cadastre-se</span>
  </p>
</div>
<script src="js/app.js"></script>
</body>
</html>
